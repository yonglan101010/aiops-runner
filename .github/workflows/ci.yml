name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e "./runner[dev]"
      - run: PYTHONPATH=runner python -m pytest runner/tests
      - run: python -m pip wheel --no-deps --wheel-dir dist ./runner
      - run: command -v aiops-runner
